name: Release (Test)

on:
  push:
    branches: [dev]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: release-test
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify migration history before deploy
        run: supabase migration list --linked

      - name: Migration dry-run
        run: supabase db push --linked --dry-run

      - name: Push migrations (non-interactive)
        run: yes | supabase db push --linked

      - name: Deploy edge functions
        run: supabase functions deploy
