name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main, dev, demo]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  demo-checks:
    if: github.ref_name == 'demo' || github.base_ref == 'demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint app
        run: npm run lint

      - name: Build app (demo mode)
        run: npm run build:demo

  test:
    if: github.ref_name != 'demo' && github.base_ref != 'demo'
    runs-on: ubuntu-latest
    env:
      # Reduce flaky lock timeouts during local DB init/migrations in CI
      PGOPTIONS: "-c lock_timeout=60s -c statement_timeout=5min"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Schema preflight contract
        run: npm run schema:preflight-contract

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase DB
        run: supabase db start

      - name: Wait for local Supabase to be ready
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Supabase to be ready..."
          for i in {1..60}; do
            if supabase status -o json >/dev/null 2>&1; then
              echo "Supabase is ready"
              supabase status
              exit 0
            fi
            sleep 2
          done
          echo "Supabase did not become ready in time"
          supabase status || true
          exit 1

      # Make the local DB state deterministic for lint/tests
      - name: Reset local DB (reapply migrations)
        run: supabase db reset

      - name: Lint database
        run: supabase db lint

      - name: Run DB tests (pgTAP)
        run: supabase test db

      - name: Verify generated types are checked in
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          supabase gen types typescript --local > .tmp/types.ts

          if [ ! -f "src/types/supabase.ts" ]; then
            echo "::error title=Missing committed types::Expected src/types/supabase.ts to exist (committed)."
            exit 1
          fi

          diff -u src/types/supabase.ts .tmp/types.ts

  dryrun:
    # Only run on PRs from same repo (fork PRs don't get secrets)
    if: github.event_name == 'pull_request' && github.base_ref != 'demo' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest

    # Serialize remote Supabase operations per target environment to avoid lock contention
    concurrency:
      group: supabase-remote-${{ github.base_ref == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: true

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Choose target by base branch of the PR
      SUPABASE_DB_PASSWORD: ${{ github.base_ref == 'main' && secrets.PRODUCTION_DB_PASSWORD || secrets.DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ github.base_ref == 'main' && secrets.PRODUCTION_PROJECT_ID || secrets.DEV_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show what migrations would run (dry-run)
        run: supabase db push --linked --dry-run --debug

  # ── RLS Contract Tests ────────────────────────────────────────────
  # Runs against remote Supabase TEST project. Skipped on fork PRs.
  rls-contract:
    if: github.event_name == 'pull_request' && github.base_ref != 'demo' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    needs: [test] # wait for local tests to pass first
    timeout-minutes: 10

    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      CONTRACT_TEST_PASSWORD: ${{ secrets.CONTRACT_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run RLS contract tests
        run: npx vitest run --config vitest.config.rls.ts

