name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase DB
        run: supabase db start

      - name: Lint database (if you use it)
        run: supabase db lint

      - name: Run DB tests (pgTAP)
        run: supabase test db

      # Recommended: compare against a committed types file path.
      # Change "src/types/supabase.ts" to wherever your repo keeps the generated types.
      - name: Verify generated types are checked in
        run: |
          mkdir -p .tmp
          supabase gen types typescript --local > .tmp/types.ts

          if [ ! -f "src/types/supabase.ts" ]; then
            echo "::error title=Missing committed types::Expected src/types/supabase.ts to exist (committed)."
            exit 1
          fi

          diff -u src/types/supabase.ts .tmp/types.ts

  dryrun:
    # Only run on PRs from same repo (fork PRs don't get secrets)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Choose target by base branch of the PR
      SUPABASE_DB_PASSWORD: ${{ github.base_ref == 'main' && secrets.PRODUCTION_DB_PASSWORD || secrets.DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ github.base_ref == 'main' && secrets.PRODUCTION_PROJECT_ID || secrets.DEV_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show what migrations would run (dry-run)
        run: supabase db push --linked --dry-run
