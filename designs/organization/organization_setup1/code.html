<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TeamHub: Organization Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "impact": ["Lexend", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">@layer base {
    body {
        font-family: "Lexend", sans-serif;
        }
    }
.nike-split-container {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    min-height: 100vh
    }
.hero-image {
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuCFsn3wJg1-1q7X3u8Apw5Wr7B1EzW8rO5bVkM6Mkzy_j19gDNxV0Su-EFf98FRyT0G61exfr2cxwJoSHBqcx5VtmCy-07taKOKXPZ8r9n-2PAyCQbgCh-wSvCDBAVW9ExYX_J92ijdSzP-0Mz91LNIPkCbV2EbB754mkdjN4eBFSjRDP2E3w-Gn_gEqU7p0dloj-1CVystVtDRE7F40aEEtqFtmqlhPy1r-Rwxwb_fRJizcjcuzoKKwGtHSrEsjMjNe_Rr85PAW8s);
    background-size: cover;
    background-position: center
    }
.ultra-bold-title {
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.05em
    }
input:focus, select:focus {
    outline: none !important;
    border-color: #000 !important;
    box-shadow: none !important
    }</style>
</head>
<body class="bg-white text-black overflow-x-hidden">
<div class="nike-split-container">
<div class="hero-image relative flex flex-col justify-between p-12">
<div class="flex items-center gap-3 text-white">
<svg class="size-8" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M13.8261 17.4264C16.7203 18.1174 20.2244 18.5217 24 18.5217C27.7756 18.5217 31.2797 18.1174 34.1739 17.4264C36.9144 16.7722 39.9967 15.2331 41.3563 14.1648L24.8486 40.6391C24.4571 41.267 23.5429 41.267 23.1514 40.6391L6.64374 14.1648C8.00331 15.2331 11.0856 16.7722 13.8261 17.4264Z" fill="currentColor"></path>
</svg>
<span class="text-xl font-black tracking-tighter uppercase">TeamHub</span>
</div>
<div class="max-w-md">
<div class="text-white/40 font-bold uppercase tracking-widest text-xs mb-4">The Standard of Youth Sports</div>
<h2 class="text-white text-4xl font-black uppercase italic tracking-tighter">Powering the next generation of athletes.</h2>
</div>
</div>
<div class="bg-white flex flex-col justify-center px-12 lg:px-24 py-16 overflow-y-auto">
<div class="max-w-md w-full mx-auto">
<header class="mb-12">
<h1 class="ultra-bold-title text-7xl lg:text-8xl uppercase mb-2">Organization Setup</h1>
<p class="text-slate-500 font-medium text-lg">Define your identity. Set the standard.</p>
</header>
<form class="space-y-8">
<div class="space-y-6">
<div class="group border-b-2 border-slate-200 transition-colors focus-within:border-black">
<label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Organization Name</label>
<input class="w-full py-4 bg-transparent border-none px-0 text-xl font-bold placeholder:text-slate-300" placeholder="e.g. NORTH SHORE ACADEMY" type="text"/>
</div>
<div class="grid grid-cols-2 gap-8">
<div class="group border-b-2 border-slate-200 transition-colors focus-within:border-black">
<label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Type</label>
<select class="w-full py-4 bg-transparent border-none px-0 text-lg font-bold appearance-none cursor-pointer">
<option value="club">CLUB</option>
<option value="school">SCHOOL</option>
<option value="academy">ACADEMY</option>
</select>
</div>
<div class="group border-b-2 border-slate-200 transition-colors focus-within:border-black">
<label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Slug</label>
<div class="flex items-center">
<span class="text-slate-400 font-bold text-sm">th.io/</span>
<input class="flex-1 py-4 bg-transparent border-none px-0 text-lg font-bold placeholder:text-slate-300" placeholder="your-name" type="text"/>
</div>
</div>
</div>
</div>
<div class="space-y-6 pt-4">
<div class="group border-b-2 border-slate-200 transition-colors focus-within:border-black">
<label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Primary Contact Email</label>
<input class="w-full py-4 bg-transparent border-none px-0 text-lg font-bold placeholder:text-slate-300" placeholder="admin@organization.com" type="email"/>
</div>
<div class="group border-b-2 border-slate-200 transition-colors focus-within:border-black">
<label class="block text-[10px] font-black uppercase tracking-widest text-slate-400">Office Location</label>
<input class="w-full py-4 bg-transparent border-none px-0 text-lg font-bold placeholder:text-slate-300" placeholder="CITY, STATE" type="text"/>
</div>
</div>
<div class="pt-8">
<button class="w-full bg-black hover:bg-zinc-900 text-white font-black uppercase tracking-widest py-6 px-8 transition-all active:scale-[0.98] text-lg" type="submit">
                        Continue to License
                    </button>
<p class="mt-4 text-center text-slate-400 text-[10px] font-bold uppercase tracking-widest">
                        Step 1 of 4 • Identity &amp; Compliance
                    </p>
</div>
</form>
<footer class="mt-16 flex items-center justify-between">
<button class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-black transition-colors">Cancel Setup</button>
<div class="flex gap-4">
<span class="material-symbols-outlined text-slate-300 cursor-help hover:text-black transition-colors">help</span>
</div>
</footer>
</div>
</div>
</div>

</body></html>
