<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Youth Sports - Youth Sports Parent Portal" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,1,0"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <title>Youth Sports</title>
  <script>
    // CRITICAL: Apply theme IMMEDIATELY before any rendering to prevent flash
    // This must run synchronously before any CSS or React loads
    (function() {
      // First, ensure light mode is default (remove dark class if present)
      document.documentElement.classList.remove('dark');
      
      try {
        // Check both old and new localStorage keys for compatibility
        const storedPreference = localStorage.getItem('theme-preference');
        const storedTheme = localStorage.getItem('theme');
        
        let mode = 'system';
        if (storedPreference === 'light' || storedPreference === 'dark' || storedPreference === 'system') {
          mode = storedPreference;
        } else if (storedTheme === 'light' || storedTheme === 'dark') {
          // Legacy support for old 'theme' key
          mode = storedTheme;
        }
        
        let resolvedTheme = 'light'; // Default to light
        if (mode === 'system') {
          resolvedTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          resolvedTheme = mode;
        }
        
        // Apply the resolved theme
        if (resolvedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        // Silently fail if localStorage is unavailable, keep light mode default
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <style>
    /* Prevent flash by setting light mode as default before CSS loads */
    html:not(.dark) {
      color-scheme: light;
    }
    html.dark {
      color-scheme: dark;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
